services:
  app_weed_removal_state_machine:
    image: gitlab-extern.atb-potsdam.de:5050/am/events/260900_bootcamp_tu_berlin/app_weed_removal_state_machine:feat-ci-pipeline
    network_mode: host
    ipc: host
    privileged: true
    environment:
      ROS_DOMAIN_ID: 2
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /workspace/config_zenoh_session.json5
      ZENOH_ROUTER_CHECK_ATTEMPTS: 20
    volumes:
      - ./config_zenoh_session.json5:/workspace/config_zenoh_session.json5
      - ./src:/workspace/src/
    restart: unless-stopped
    command: tail -f /dev/null
